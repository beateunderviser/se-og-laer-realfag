[build]
  command = "node build.mjs"
  publish = "dist"

[build.environment]
  NODE_VERSION = "20"
  # Regnearket med videoene (må være delt som «Alle med linken kan se»)
  SHEET_CSV_URL = "https://docs.google.com/spreadsheets/d/17M9X_rBIlTBoM5SxcAgJGoL2_lrEgl7ZiUj7ktUO0C4/export?format=csv"

[[headers]]
  for = "/*"
  [headers.values]
    X-Content-Type-Options = "nosniff"
    Referrer-Policy = "strict-origin-when-cross-origin"

[[headers]]
  for = "/*.css"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

[[headers]]
  for = "/*.js"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"
